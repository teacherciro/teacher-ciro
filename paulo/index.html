<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Ciro | Paulo 19/05</title>
<style>
body{margin:0;padding:20px;background:#0e0e14;color:#f0f0f5;font-family:Arial,sans-serif;min-height:100vh}
h1{text-align:center;color:#a99fff;font-size:28px;margin-bottom:4px}
p.sub{text-align:center;color:#8888aa;font-size:14px;margin-bottom:24px}
.tabs{display:flex;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);margin-bottom:20px}
.tab{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:700;cursor:pointer;background:#16161f;color:#8888aa;border:none}
.tab.active{background:#7c6fff;color:#fff}
.tab.locked{opacity:.4;cursor:not-allowed}
.scores{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.chip{background:#16161f;border:1px solid rgba(255,255,255,0.1);border-radius:99px;padding:5px 14px;font-size:13px;color:#8888aa}
.chip b{color:#f0f0f5}
.chip.c b{color:#3ecf8e}
.chip.w b{color:#ff6b6b}
.pbar{height:3px;background:rgba(255,255,255,0.08);border-radius:99px;margin-bottom:20px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,#7c6fff,#3ecf8e);width:0;transition:width .4s}
.card{background:#16161f;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px;margin-bottom:12px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:99px;margin-bottom:14px}
.tv{background:rgba(124,111,255,.2);color:#a99fff}
.tg{background:rgba(255,107,107,.2);color:#ff9090}
.word{font-size:26px;font-weight:900;color:#fff;text-align:center;margin-bottom:6px;line-height:1.3}
.blank{color:#7c6fff;border-bottom:2px solid #7c6fff;padding:0 4px}
.qtext{text-align:center;font-size:13px;color:#8888aa;margin-bottom:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#1e1e2a;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px 10px;font-size:14px;color:#f0f0f5;cursor:pointer;text-align:center;line-height:1.3;width:100%;font-family:Arial,sans-serif}
.opt.correct{background:rgba(62,207,142,.15);border-color:#3ecf8e;color:#3ecf8e;font-weight:700}
.opt.wrong{background:rgba(255,107,107,.1);border-color:#ff6b6b;color:#ff6b6b}
.opt:disabled{cursor:default}
.fb{text-align:center;font-size:14px;padding:12px;border-radius:10px;margin-top:12px;display:none;line-height:1.5}
.fb.show{display:block}
.fb.ok{background:rgba(62,207,142,.1);color:#3ecf8e;border:1px solid rgba(62,207,142,.2)}
.fb.no{background:rgba(255,107,107,.1);color:#ff6b6b;border:1px solid rgba(255,107,107,.2)}
.nxt{width:100%;padding:14px;background:#7c6fff;border:none;border-radius:12px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;margin-top:10px;display:none;font-family:Arial,sans-serif}
.nxt.show{display:block}
.done{display:none;background:#16161f;border:1px solid rgba(62,207,142,.3);border-radius:16px;padding:32px 24px;text-align:center;margin-bottom:12px}
.done.show{display:block}
.done h2{color:#3ecf8e;font-size:24px;margin-bottom:10px}
.done p{color:#8888aa;margin-bottom:20px}
.gobtn{padding:13px 32px;background:#7c6fff;border:none;border-radius:12px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;font-family:Arial,sans-serif}
</style>
</head>
<body>
<h1>Aula do Paulo</h1>
<p class="sub">Teacher Ciro esta de olho em voce | 19/05</p>
<div class="tabs">
  <button class="tab active" id="tv" onclick="switchPhase('vocab')">Vocabulario</button>
  <button class="tab locked" id="tg" onclick="switchPhase('grammar')">Gramatica</button>
</div>
<div class="scores">
  <div class="chip c">Acertos: <b id="hits">0</b></div>
  <div class="chip w">Erros: <b id="misses">0</b></div>
  <div class="chip">Questao: <b id="qnum">1</b></div>
</div>
<div class="pbar"><div class="pfill" id="prog"></div></div>
<div class="done" id="done">
  <h2>Vocab concluido!</h2>
  <p id="donemsg"></p>
  <button class="gobtn" onclick="goGrammar()">Ir para Gramatica</button>
</div>
<div class="card" id="card">
  <div style="text-align:center">
    <div class="tag tv" id="ltag">Vocabulario</div>
    <div class="word" id="word">...</div>
    <div class="qtext" id="qtext"></div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb"></div>
</div>
<button class="nxt" id="nxt" onclick="next()">Proxima</button>
<script>
var vocab=[
  {w:"this",t:"este / esta",o:["este / esta","aquele / aquela","estes / estas","aqueles / aquelas"],e:"'This' = singular perto. Ex: This is my book."},
  {w:"already",t:"ja",o:["ja","ainda","tambem","sempre"],e:"Ex: I have already watched the movie."},
  {w:"still",t:"ainda - meio da frase",o:["ainda - meio da frase","ainda - final","tambem - meio","ja"],e:"Ex: I still like it."},
  {w:"yet",t:"ainda - final da frase",o:["ainda - final da frase","ainda - afirmacao","tambem","ja"],e:"Ex: I don't know yet."},
  {w:"also",t:"tambem - meio da frase",o:["tambem - meio da frase","tambem - final","ainda","ja"],e:"Ex: I also like it."},
  {w:"too",t:"tambem - final da frase",o:["tambem - final da frase","tambem - meio","ainda","ja"],e:"Ex: I like it too."},
  {w:"currently",t:"no momento, atualmente",o:["no momento, atualmente","antigamente","futuramente","raramente"],e:"Ex: I am currently out of the office."},
  {w:"meantime",t:"enquanto isso",o:["enquanto isso","depois","antes","durante"],e:"Ex: In the meantime, we can study."},
  {w:"hopefully",t:"espero, tomara",o:["espero, tomara","felizmente","infelizmente","certamente"],e:"Ex: Hopefully, he will arrive on time."},
  {w:"above",t:"acima",o:["acima","abaixo","ao lado","dentro"],e:"Ex: Based on those settings above."},
  {w:"thick",t:"grosso, espesso",o:["grosso, espesso","fino","largo","alto"],e:"Ex: The thickness of the material."},
  {w:"to assist",t:"dar suporte, ajudar",o:["dar suporte, ajudar","assistir filme","perguntar","chegar"],e:"Cuidado: assist NAO e assistir filme!"},
  {w:"to arrive",t:"chegar",o:["chegar","sair","ficar","voltar"],e:"Ex: Hopefully, he will arrive on time."},
  {w:"to scan",t:"escanear",o:["escanear","ligar","desligar","calcular"],e:"Ex: The gauge scans for 3.17 seconds."},
  {w:"to turn on",t:"ligar",o:["ligar","desligar","escanear","ajustar"],e:"Ex: If that setting is turned on."},
  {w:"either...or",t:"ou...ou",o:["ou...ou","nem...nem","e...e","se...entao"],e:"Ex: Either I stay home or I go to the gym."}
];
var grammar=[
  {s:"I don't know ___ .",a:"yet",o:["yet","still","already","also"],t:"Yet / Still",e:"'Yet' no final de negacoes."},
  {s:"She ___ watched the movie.",a:"already",o:["already","yet","still","also"],t:"Already",e:"'Already' = acao concluida antes do esperado."},
  {s:"I ___ like to watch movies.",a:"also",o:["also","too","yet","still"],t:"Also / Too",e:"'Also' vai antes do verbo, no meio da frase."},
  {s:"I like it ___ .",a:"too",o:["too","also","yet","still"],t:"Also / Too",e:"'Too' vai sempre no final da frase."},
  {s:"I am ___ out of the office.",a:"currently",o:["currently","hopefully","already","yet"],t:"Currently",e:"'Currently' acompanha o present continuous."},
  {s:"___ , he will arrive on time.",a:"Hopefully",o:["Hopefully","Currently","Already","Still"],t:"Hopefully",e:"'Hopefully' no inicio expressa expectativa."},
  {s:"___ I stay home OR I go to the gym.",a:"Either",o:["Either","Neither","Both","Whether"],t:"Either...or",e:"'Either...or' apresenta duas opcoes."},
  {s:"___ answers clarify your questions.",a:"These",o:["These","Those","This","That"],t:"Demonstrativos",e:"'These' = plural, perto do falante."},
  {s:"Based on ___ settings above.",a:"those",o:["those","these","this","that"],t:"Demonstrativos",e:"'Those' = plural, distante ou ja mencionado."},
  {s:"I am happy ___ assist.",a:"to",o:["to","for","of","in"],t:"Infinitivo",e:"Happy + to + infinitivo."},
  {s:"Did she ___ the movie?",a:"like",o:["like","liked","likes","liking"],t:"Past Simple",e:"Apos 'did', o verbo volta para a forma base."},
  {s:"My day ___ good.",a:"was",o:["was","is","were","been"],t:"Past Simple - to be",e:"'Was' e o passado de 'is/am'."}
];

var phase="vocab",pool=[],cur=null;
var hits=0,misses=0,qnum=1,answered=false,vcnt=0,vdone=false;

function shuffle(a){
  var b=a.slice(),i,j,t;
  for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t;}
  return b;
}
function $(id){return document.getElementById(id);}
function txt(id,v){$(id).textContent=v;}

function buildPool(){pool=shuffle(phase==="vocab"?vocab:grammar);}

function resetScore(){
  hits=0;misses=0;qnum=1;answered=false;
  txt("hits","0");txt("misses","0");txt("qnum","1");
  $("prog").style.width="0%";
  $("nxt").className="nxt";
  $("done").className="done";
  $("card").style.display="block";
  $("fb").className="fb";
  $("opts").innerHTML="";
}

function switchPhase(p){
  if(p==="grammar"&&!vdone)return;
  phase=p;
  $("tv").className="tab"+(p==="vocab"?" active":"");
  $("tg").className="tab"+(p==="grammar"?" active":" locked");
  resetScore();buildPool();next();
}

function goGrammar(){
  vdone=true;
  $("tg").className="tab";
  switchPhase("grammar");
}

function mkHandler(opt){return function(){handleAnswer(opt);};}

function next(){
  answered=false;
  $("nxt").className="nxt";
  $("fb").className="fb";
  $("done").className="done";
  $("card").style.display="block";
  if(pool.length===0)buildPool();
  cur=pool.pop();

  if(phase==="vocab"){
    txt("ltag","Vocabulario - 19/05");
    $("ltag").className="tag tv";
    txt("word",cur.w);
    txt("qtext","Qual e a traducao?");
  } else {
    txt("ltag","Gramatica - "+cur.t);
    $("ltag").className="tag tg";
    var parts=cur.s.split("___");
    $("word").innerHTML=parts[0]+'<span class="blank">___</span>'+(parts[1]||"");
    txt("qtext","Complete a frase:");
  }

  var os=shuffle(cur.o);
  var c=$("opts");
  c.innerHTML="";
  for(var k=0;k<os.length;k++){
    var btn=document.createElement("button");
    btn.className="opt";
    btn.textContent=os[k];
    btn.onclick=mkHandler(os[k]);
    c.appendChild(btn);
  }
}

function handleAnswer(chosen){
  if(answered)return;
  answered=true;
  var correct=phase==="vocab"?cur.t:cur.a;
  var btns=$("opts").getElementsByTagName("button");
  for(var i=0;i<btns.length;i++){
    btns[i].disabled=true;
    if(btns[i].textContent===correct)btns[i].className="opt correct";
  }
  var fb=$("fb");
  if(chosen===correct){
    hits++;txt("hits",hits);
    fb.textContent="Correto! "+cur.e;
    fb.className="fb ok show";
  } else {
    misses++;txt("misses",misses);
    for(var j=0;j<btns.length;j++){
      if(btns[j].textContent===chosen)btns[j].className="opt wrong";
    }
    fb.textContent="Errou! Correto: '"+correct+"'. "+cur.e;
    fb.className="fb no show";
  }
  var total=hits+misses;
  $("prog").style.width=Math.min(100,Math.round(hits/total*100))+"%";
  qnum++;txt("qnum",qnum);
  if(phase==="vocab"){
    vcnt++;
    if(vcnt>=8){
      setTimeout(function(){
        $("card").style.display="none";
        $("nxt").className="nxt";
        txt("donemsg","Voce acertou "+hits+" de "+total+" ("+Math.round(hits/total*100)+"%). Hora da gramatica!");
        $("done").className="done show";
      },600);
      return;
    }
  }
  $("nxt").className="nxt show";
}

buildPool();
next();
</script>
</body>
</html>
